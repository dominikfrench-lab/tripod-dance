<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Tripod Dance: The Unweaving</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07060f;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;-webkit-tap-highlight-color:transparent;position:fixed;inset:0}
  canvas{display:block;position:fixed;left:0;top:0;touch-action:none;outline:none}
  #rotate{display:none;position:fixed;inset:0;z-index:10;background:rgba(7,6,15,.95);color:#e8dcff;
    font:600 18px system-ui,-apple-system,Segoe UI,sans-serif;flex-direction:column;align-items:center;

  #rotate .ph{width:54px;height:90px;border:4px solid #b48cff;border-radius:10px;animation:rot 2s ease-in-out infinite}
  @keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}

<body>
<canvas id="game" tabindex="0"></canvas>
<div id="rotate"><div class="ph"></div><div>Turn your device sideways<br>for the best dance floor.</div><button id="rotateBtn">Play anyway</button></div>
<script>
'use strict';
/* =====================================================================
   TRIPOD DANCE: THE UNWEAVING
   A free-roam magical adventure. You are a three-legged spider-thing
   whose every step is part of a dance.

   File layout (search for the ==== banners):
     1. CONFIG ............ tunable constants
     2. UTILS ............. math, seeded RNG, noise
     3. AUDIO ............. WebAudio synth sfx + beat-synced music
     4. BEAT .............. the global rhythm clock
     5. INPUT ............. keyboard, mouse, touch (joystick + buttons)
     6. UI BUTTONS ........ canvas button registry (mouse + touch)
     7. DATA .............. biomes, enemies, bosses, skills, lore
     8. WORLD ............. procedural overworld + chunk renderer
     9. PLAYER ............ stats, tripod IK gait, drawing
    10. COMBAT ............ projectiles, hazards, beams, damage
    11. ABILITIES ......... skills + rhythm empowerment
    12. ENEMIES ........... AI + drawing
    13. BOSSES ............ bosses + minibosses, phases, patterns
    14. DUNGEONS .......... generated interiors, traps, treasure
    15. STRUCTURES ........ shrines, ruins, obelisks, tablets
    16. GAME STATE ........ save/load, spawning, progression
    17. RENDER ............ world, HUD, minimap, menus
    18. MAIN LOOP ......... fixed timestep, resize, debug hook
   ===================================================================== */

/* ==================== 1. CONFIG ==================== */
const CFG = {
  SEED: 20261114,
  WORLD: 14000,              // world is WORLD x WORLD pixels, start in the middle
  BIOME_R: [2300, 4100, 5800], // ring radii: forest | desert | frozen | corrupted
  CHUNK: 512,                // terrain cache chunk size
  MAX_CHUNKS: 36,            // chunk cache size (memory)
  CHUNKS_PER_FRAME: 2,       // max new chunks rendered per frame (avoid hitches)
  OBST_CELL: 150,            // obstacle placement grid
  FOG_CELL: 200,             // fog-of-war resolution
  STEP: 1 / 60,              // fixed timestep
  BPM: 112,                  // music + dance tempo
  BEAT_WINDOW: 0.11,         // seconds either side of a beat that count as "on beat"
  RHYTHM: { onBeat: 15, offBeat: -8, bolt: 1.2, kill: 3, decay: 2.5, dmgBonus: 0.5 },
  PLAYER: { speed: 235, accel: 11, r: 15, hp: 100, mana: 100, manaRegen: 8,
            dashSpeed: 760, dashTime: 0.22, dashCD: 0.85, iframes: 0.55 },
  GAIT: { legLen: 33, hip: 10, rest: 37, lead: 0.2, turnMove: 15, turnIdle: 30,
          flipEvery: 8, stepDurMove: 0.1, stepDurIdle: 0.17, lift: 12, bodyH: 21 },
  BOLT: { dmg: 14, speed: 640, life: 0.85, r: 6, perBeat: 2 },
  ENEMY_CAP: 24, ENEMY_CAP_MOBILE: 18,
  SPAWN_EVERY: 1.0, SPAWN_MIN: 640, SPAWN_MAX: 920, DESPAWN: 1500, ACTIVE_R: 1300,
  XP_BASE: 40, XP_GROWTH: 1.3,
  AUTOSAVE: 15,
  MAX_DPR: 2,
  MAX_PARTICLES: 700, MAX_PARTICLES_MOBILE: 320,
  DTILE: 48,                 // dungeon tile size
  SAVE_KEY: 'tripodDance.save.v1',
};

/* ==================== 2. UTILS ==================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const easeOut = t => 1 - (1 - t) * (1 - t);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y, s) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(ix, iy, s), hash2(ix + 1, iy, s), u), lerp(hash2(ix, iy + 1, s), hash2(ix + 1, iy + 1, s), u), v);
}
function fbm(x, y, s, oct = 3) { let t = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < oct; i++) { t += vnoise(x * f, y * f, s + i * 17) * a; n += a; a *= 0.5; f *= 2; } return t / n; }
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixRgb(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
const rgbStr = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
function rgba(hex, a) { const c = hexToRgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrapText(g, text, maxW) {
  const out = []; for (const para of String(text).split('\n')) {
    let line = ''; for (const w of para.split(' ')) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
    out.push(line);
  } return out;
}
const IS_TOUCH_DEVICE = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* ==================== 3. AUDIO ==================== */
const SFX = (() => {
  let ctx = null, master, sfxG, musG, noiseBuf, enabled = true;
  const lastPlay = {};
  function init() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        ctx = new AC(); master = ctx.createGain(); master.gain.value = enabled ? 0.55 : 0; master.connect(ctx.destination);
        sfxG = ctx.createGain(); sfxG.gain.value = 0.75; sfxG.connect(master);
        musG = ctx.createGain(); musG.gain.value = 0.32; musG.connect(master);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { ctx = null; }
  }
  const ok = () => ctx && enabled && ctx.state === 'running';
  function throttle(name, gap) { const t = performance.now(); if (lastPlay[name] && t - lastPlay[name] < gap) return false; lastPlay[name] = t; return true; }
  function tone(f, dur, type = 'sine', vol = 0.2, slide = 0, delay = 0, out) {
    if (!ok()) return; const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out || sfxG); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol = 0.2, freq = 1200, delay = 0, type = 'bandpass', out, q = 1) {
    if (!ok()) return; const t = ctx.currentTime + delay;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(out || sfxG); s.start(t); s.stop(t + dur + 0.05);
  }
  const S = {
    bolt() { if (throttle('bolt', 40)) tone(rand(820, 900), 0.11, 'triangle', 0.07, 0.55); },
    hit() { if (throttle('hit', 35)) noise(0.07, 0.14, 1800); },
    block() { if (throttle('block', 60)) tone(1600, 0.08, 'square', 0.04, 0.7); },
    kill() { if (throttle('kill', 50)) { tone(300, 0.18, 'sawtooth', 0.06, 0.3); noise(0.15, 0.1, 600); } },
    dash() { tone(300, 0.2, 'sine', 0.12, 3); noise(0.18, 0.08, 3000, 0, 'highpass'); },
    step(i) { if (throttle('step', 60)) tone([392, 494, 587][i % 3], 0.05, 'sine', 0.025); },
    pickup() { if (throttle('pick', 45)) tone(rand(1200, 1500), 0.08, 'sine', 0.05, 1.4); },
    hurt() { tone(180, 0.25, 'sawtooth', 0.12, 0.5); noise(0.2, 0.12, 400); },
    level() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.1, 1, i * 0.08)); },
    unlock() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, 'sine', 0.09, 1, i * 0.06)); },
    chest() { [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.25, 'triangle', 0.08, 1, i * 0.07)); noise(0.3, 0.05, 5000, 0, 'highpass'); },
    zap() { tone(1400, 0.15, 'sawtooth', 0.06, 0.25); noise(0.12, 0.08, 4000); },
    nova() { tone(200, 0.5, 'sine', 0.2, 4); noise(0.4, 0.12, 900); },
    boom() { tone(90, 0.6, 'sine', 0.25, 0.4); noise(0.6, 0.22, 300, 0, 'lowpass'); },
    blink() { tone(600, 0.15, 'sine', 0.1, 2.5); tone(1200, 0.15, 'sine', 0.06, 0.5, 0.08); },
    shield() { [523, 784, 1046].forEach((f, i) => tone(f, 0.5, 'sine', 0.06, 1, i * 0.04)); },
    web() { noise(0.25, 0.1, 2500); tone(500, 0.2, 'triangle', 0.05, 0.6); },
    summon() { [330, 440, 554].forEach((f, i) => tone(f, 0.2, 'square', 0.04, 1.5, i * 0.07)); },
    blades() { tone(700, 0.4, 'sawtooth', 0.05, 2); },
    beatOk() { tone(1568, 0.06, 'sine', 0.05); },
    crescendo() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.4, 'triangle', 0.08, 1, i * 0.05)); },
    roar() { tone(70, 1.0, 'sawtooth', 0.18, 0.6); noise(0.9, 0.18, 250, 0, 'lowpass'); },
    warn() { if (throttle('warn', 120)) tone(440, 0.1, 'square', 0.03, 1.2); },
    eshot() { if (throttle('eshot', 70)) tone(rand(300, 380), 0.12, 'triangle', 0.04, 0.7); },
    ui() { tone(900, 0.05, 'sine', 0.05); },
    rune(i) { tone([440, 554, 659, 880][i % 4], 0.35, 'sine', 0.1); },
    fail() { tone(200, 0.3, 'square', 0.06, 0.6); },
    portal() { tone(200, 0.8, 'sine', 0.12, 4); noise(0.8, 0.06, 2000); },
  };
  // Music: a little beat-synced groove. scale per biome (semitones from root).
  const SCALES = [[0, 3, 7, 10, 12, 15], [0, 2, 3, 7, 8, 12], [0, 2, 5, 7, 9, 12], [0, 1, 4, 6, 7, 10]];
  const ROOTS = [196, 174.6, 207.7, 146.8];
  const ARP = [0, 2, 4, 2, 5, 3, 4, 1, 0, 2, 4, 5, 3, 2, 1, 2];
  function music(n, biome, intensity) {
    if (!ok()) return; const sc = SCALES[biome] || SCALES[0], root = ROOTS[biome] || 196, m = n % 16;
    if (m % 4 === 0) { tone(110, 0.22, 'sine', 0.35 * (0.6 + intensity * 0.4), 0.35, 0, musG); }
    if (m % 8 === 4) noise(0.12, 0.12, 1800, 0, 'bandpass', musG);
    if (m % 2 === 1) noise(0.04, 0.05 + intensity * 0.04, 8000, 0, 'highpass', musG);
    if (m % 8 === 0) tone(root / 2 * Math.pow(2, sc[(n >> 4) % 2 ? 3 : 0] / 12), 0.9, 'triangle', 0.1, 1, 0, musG);
    if (m % 2 === 0 || intensity > 0.5) { const st = sc[ARP[m] % sc.length]; tone(root * 2 * Math.pow(2, st / 12), 0.18, intensity > 0.6 ? 'square' : 'triangle', 0.025 + intensity * 0.02, 1, 0, musG); }
  }
  return {
    init, S, music,
    get enabled() { return enabled; },
    toggle() { enabled = !enabled; if (master) master.gain.value = enabled ? 0.55 : 0; return enabled; },
  };
})();

/* ==================== 4. BEAT ==================== */
// Everything dances to this clock: leg steps, auto-fire, music, rhythm meter.
const Beat = {
  time: 0, len: 60 / CFG.BPM, eighth: -1,
  update(dt) { this.time += dt; },
  phase() { return (this.time % this.len) / this.len; },            // 0..1 within beat
  offset() { const p = this.phase(); return Math.min(p, 1 - p) * this.len; }, // seconds to nearest beat
  onBeat(win) { return this.offset() <= win; },
  pulse() { const p = this.phase(); return Math.max(0, 1 - p * 4); }, // 1 right on beat, fades quickly
};

/* ==================== 5. INPUT ==================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VW = window.innerWidth, VH = window.innerHeight, DPR = 1, U = 1; // U = UI scale

const KEYMAP = {
  KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
  Space: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash',
  Digit1: 'ab0', KeyQ: 'ab0', Digit2: 'ab1', KeyR: 'ab1', Digit3: 'ab2', KeyF: 'ab2', Digit4: 'ab3', KeyC: 'ab3',
  KeyE: 'interact', KeyT: 'tree', Tab: 'tree', KeyM: 'map', Escape: 'pause', KeyP: 'pause',
  KeyH: 'potion', KeyX: 'potion', Enter: 'confirm',
};
const Input = {
  keys: new Set(), pressed: new Set(),
  mouse: { x: 0, y: 0, down: false, seen: false },
  touchMode: IS_TOUCH_DEVICE && !matchMedia('(pointer:fine)').matches,
  joy: { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 },
  aim: { active: false, id: null, x: 0, y: 0 },       // right-side touch aim
  atk: { active: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 }, // attack button drag
  roles: new Map(),
  take(a) { if (this.pressed.has(a)) { this.pressed.delete(a); return true; } return false; },
  endTick() { this.pressed.clear(); },
  moveVec() {
    let x = 0, y = 0;
    if (this.keys.has('left')) x -= 1; if (this.keys.has('right')) x += 1;
    if (this.keys.has('up')) y -= 1; if (this.keys.has('down')) y += 1;
    if (this.joy.active) {
      const dx = this.joy.x - this.joy.ox, dy = this.joy.y - this.joy.oy, R = 56 * U, l = Math.hypot(dx, dy);
      if (l > 6) { const m = Math.min(1, l / R); x = dx / l * m; y = dy / l * m; }
    }
    const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    return { x, y };
  },
  attackHeld() { return this.mouse.down || this.aim.active || this.atk.active; },
};

window.addEventListener('keydown', e => {
  SFX.init();
  const a = KEYMAP[e.code];
  if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!a) return;
  if (!e.repeat) Input.pressed.add(a);
  Input.keys.add(a);
  if (Input.touchMode && !e.repeat) Input.touchMode = false;
});
window.addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) Input.keys.delete(a); });
window.addEventListener('blur', () => { Input.keys.clear(); Input.mouse.down = false; });

function pointerDown(e) {
  SFX.init();
  const x = e.clientX, y = e.clientY, isTouch = e.pointerType !== 'mouse';
  if (isTouch) { Input.touchMode = true; e.preventDefault(); } else { Input.mouse.x = x; Input.mouse.y = y; }
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
  const b = UI.hit(x, y);
  if (b) {
    if (b.hold) {
      Input.roles.set(e.pointerId, { type: 'hold', id: b.id });
      if (b.id === 'atk') { Object.assign(Input.atk, { active: true, id: e.pointerId, ox: x, oy: y, dx: 0, dy: 0 }); }
    } else {
      Input.roles.set(e.pointerId, { type: 'ui' });
      if (b.onClick) { b.onClick(); SFX.S.ui(); }
    }
    return;
  }
  if (isTouch) {
    if (G.state !== 'play') { Input.roles.set(e.pointerId, { type: 'none' }); return; }
    if (x < VW * 0.45 && !Input.joy.active) {
      Object.assign(Input.joy, { active: true, id: e.pointerId, ox: x, oy: y, x, y });
      Input.roles.set(e.pointerId, { type: 'joy' });
    } else if (!Input.aim.active) {
      Object.assign(Input.aim, { active: true, id: e.pointerId, x, y });
      Input.roles.set(e.pointerId, { type: 'aim' });
    }
  } else {
    if (e.button === 0) Input.mouse.down = true;
    if (e.button === 2) Input.pressed.add('dash');
    Input.roles.set(e.pointerId, { type: 'mouse' });
  }
}
function pointerMove(e) {
  const x = e.clientX, y = e.clientY;
  if (e.pointerType === 'mouse') {
    if (Math.abs(x - Input.mouse.x) + Math.abs(y - Input.mouse.y) > 4 && !Input.joy.active) { if (Input.mouse.seen) Input.touchMode = false; Input.mouse.seen = true; }
    Input.mouse.x = x; Input.mouse.y = y;
  }
  const r = Input.roles.get(e.pointerId); if (!r) return;
  if (r.type === 'joy') { Input.joy.x = x; Input.joy.y = y; }
  else if (r.type === 'aim') { Input.aim.x = x; Input.aim.y = y; }
  else if (r.type === 'hold' && r.id === 'atk') { Input.atk.dx = x - Input.atk.ox; Input.atk.dy = y - Input.atk.oy; }
}
function pointerUp(e) {
  const r = Input.roles.get(e.pointerId);
  if (r) {
    if (r.type === 'joy') Input.joy.active = false;
    else if (r.type === 'aim') Input.aim.active = false;
    else if (r.type === 'hold' && r.id === 'atk') Input.atk.active = false;
    Input.roles.delete(e.pointerId);
  }
  if (e.pointerType === 'mouse' && e.button === 0) Input.mouse.down = false;
}
canvas.addEventListener('pointerdown', pointerDown, { passive: false });
canvas.addEventListener('pointermove', pointerMove, { passive: false });
canvas.addEventListener('pointerup', pointerUp);
canvas.addEventListener('pointercancel', pointerUp);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => e.preventDefault(), { passive: false });
// iOS: block pinch / double-tap zoom & page scrolling
['gesturestart', 'gesturechange', 'gestureend'].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouchEnd < 300) e.preventDefault(); lastTouchEnd = n; }, { passive: false });

/* ==================== 6. UI BUTTONS ==================== */
// Every frame, menus/HUD register clickable rects; pointer events test them.
const UI = {
  btns: [],
  begin() { this.btns.length = 0; },
  add(id, x, y, w, h, opts = {}) { const b = Object.assign({ id, x, y, w, h }, opts); this.btns.push(b); return b; },
  hit(px, py) {
    for (let i = this.btns.length - 1; i >= 0; i--) {
      const b = this.btns[i];
      if (b.circle) { if (dist(px, py, b.x, b.y) <= b.w) return b; }
      else if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return b;

const World = {

function biomeAt(x, y) {

function levelAt(x, y) {

const gkey = (cx, cy) => cx * 8192 + cy;
function addObstacle(o) {

  for (let cx = Math.floor((o.x - o.r) / G_); cx <= Math.floor((o.x + o.r) / G_); cx++)
    for (let cy = Math.floor((o.y - o.r) / G_); cy <= Math.floor((o.y + o.r) / G_); cy++) {

    const a = World.grid.get(gkey(cx, cy)); if (a) for (const o of a) if (!seen.has(o)) { seen.add(o); out.push(o); }

}

  const polar = (a, r) => [C + Math.cos(a) * r, C + Math.sin(a) * r];
  const inB = (x, y, m = 500) => x > m && y > m && x < World.size - m && y < World.size - m;

      }
    } else if (s.type === 'boss') {
      const n = s.boss === 4 ? 16 : 12; for (let i = 0; i < n; i++) { const a = i / n * TAU; addObstacle({ x: s.x + Math.cos(a) * (s.arenaR + 40), y: s.y + Math.sin(a) * (s.arenaR + 40), r: 22, type: 'stone', solid: true, b: s.biome }); }
    } else if (s.type === 'dungeon') {

  const types = [['tree', 'tree', 'tree', 'shroom', 'rock'], ['crystal', 'crystal', 'rock', 'rock', 'crystal'], ['pine', 'pine', 'ice', 'rock', 'pine'], ['deadtree', 'spire', 'deadtree', 'rock', 'spire']];
  const N = Math.ceil(World.size / CFG.OBST_CELL);

/* ==================== 16. GAME STATE ==================== */
function hasSave() { try { return !!localStorage.getItem(CFG.SAVE_KEY); } catch (e) { return false; } }

    const d = {
      v: 1, p: { x: pos.x, y: pos.y, level: P.level, xp: P.xp, shards: P.shards, sp: P.sp, skills: [...P.skills], slots: P.slots, potions: P.potions, maxPotions: P.maxPotions, inf: P.inf },
      prog: { chests: [...G.prog.chests], obelisks: [...G.prog.obelisks], tablets: [...G.prog.tablets], shrines: [...G.prog.shrines], bosses: G.prog.bosses, dungeons: G.prog.dungeons, relics: [...G.prog.relics] },
      respawn: G.respawn, fog: Array.from(World.fog).join(''), stats: G.stats, sound: SFX.enabled, victory: G.victory,

}

    Object.assign(P, { x: p.x, y: p.y, level: p.level, xp: p.xp, shards: p.shards, sp: p.sp, potions: p.potions, maxPotions: p.maxPotions || 3 });

    G.prog = { chests: new Set(d.prog.chests), obelisks: new Set(d.prog.obelisks), tablets: new Set(d.prog.tablets), shrines: new Set(d.prog.shrines), bosses: d.prog.bosses, dungeons: d.prog.dungeons, relics: new Set(d.prog.relics) };

    if (d.fog && d.fog.length === World.fog.length) for (let i = 0; i < d.fog.length; i++) World.fog[i] = d.fog.charCodeAt(i) === 49 ? 1 : 0;

function drawMap() {

  if (G.mode === 'dungeon') {

    for (let j = 0; j < D.H; j++) for (let i = 0; i < D.W; i++) { const v = D.tiles[j * D.W + i]; if (!v || !D.seen[j * D.W + i]) continue; g.fillStyle = v === 3 ? D.pal.glow : v === 2 ? '#8a7f99' : '#5a5070'; g.fillRect(x + i * ts, y + j * ts, ts + 0.5, ts + 0.5); }

/* ==================== 18. MAIN LOOP ==================== */
let rotateDismissed = false;
function resize() {
  VW = window.innerWidth; VH = window.innerHeight; DPR = Math.min(CFG.MAX_DPR, window.devicePixelRatio || 1);
  if (IS_TOUCH_DEVICE && VW * VH * DPR * DPR > 2.6e6) DPR = Math.max(1, Math.sqrt(2.6e6 / (VW * VH)));
  canvas.width = Math.round(VW * DPR); canvas.height = Math.round(VH * DPR); canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  U = clamp(Math.min(VW / 1100, VH / 640), 0.62, 1.3);
  G.cam.zoom = clamp(Math.sqrt(VW * VH) / Math.sqrt(1280 * 720), 0.62, 1.25);
  const portrait = IS_TOUCH_DEVICE && VH > VW && !rotateDismissed;
  document.getElementById('rotate').style.display = portrait ? 'flex' : 'none';
}
document.getElementById('rotateBtn').addEventListener('click', () => { rotateDismissed = true; resize(); });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (G.state === 'play') { G.state = 'paused'; G.pauseView = 'main'; } saveGame(); } });

let lastT = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now; if (dt > 0.25) dt = 0.25; if (dt < 0) dt = 0;
  acc += dt; let steps = 0;
  while (acc >= CFG.STEP && steps < 5) { update(CFG.STEP); acc -= CFG.STEP; steps++; }
  if (steps >= 5) acc = 0;
  if (steps > 0) Input.endTick();
  try { render(); } catch (e) { console.error(e); }
}
function boot() {
  resize(); genWorld(); resetPlayer(); G.cam.x = P.x; G.cam.y = P.y;
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
}
// Debug / test hook (used by automated tests; harmless for players)
window.__debug = {

  start(cont = false) { startGame(cont); },
  teleport(x, y) { P.x = x; P.y = y; initLegs(); G.cam.x = x; G.cam.y = y; },
  toBoss(i) { const s = bossStruct(i); this.teleport(s.x, s.y + s.arenaR + 120); },
  enterBoss(i) { const s = bossStruct(i); this.teleport(s.x, s.y + 150); },
  toDungeon(i) { const s = World.structs.find(t => t.type === 'dungeon' && t.dungeon === i); this.teleport(s.x, s.y + 80); return s; },
  enterDungeon(i) { enterDungeon(i, this.toDungeon(i)); },

  unlockAll() { for (const s of SKILLS) P.skills.add(s.id); P.slots = ['chain', 'nova', 'meteor', 'blades']; recalcStats(); P.hp = P.st.maxHp; P.mana = P.st.maxMana; },
  god(on = true) { G.god = on; },
  spawn(type, n = 1, lvl = 3) { for (let i = 0; i < n; i++) makeEnemy(type, P.x + rand(-250, 250), P.y + rand(-250, 250), lvl, curBiome()); },
